[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  ADMIN_ACCESS_CODE = "QIMMAH-ADMIN-2026"
  JWT_SECRET = "alqimmah-verbal-aptitude-jwt-secret-secure-2026-edition"

[[redirects]]
